<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Actualización</title>
<style>
  :root {
    --bg: #ffffff; --fg: #111b21; --muted: #54656f; --line: #e9edef;
    --accent: #128c7e; --accent-hover: #0f7a6e; --track: #e9edef;
    --ghost-hover: #f0f2f5; --shadow: 0 18px 48px rgba(11, 20, 26, .28), 0 2px 8px rgba(11, 20, 26, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f2c34; --fg: #e9edef; --muted: #8696a0; --line: #2a3942;
      --accent: #21c063; --accent-hover: #1da955; --track: #2a3942;
      --ghost-hover: #2a3942; --shadow: 0 18px 48px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--fg); padding: 18px; -webkit-font-smoothing: antialiased; user-select: none;
  }
  .card {
    height: 100%; background: var(--bg); border-radius: 18px; box-shadow: var(--shadow);
    border: 1px solid var(--line); padding: 22px 22px 18px; display: flex; flex-direction: column;
    -webkit-app-region: drag;
    opacity: 0; transform: translateY(8px) scale(.97);
    transition: opacity .28s cubic-bezier(.2,0,0,1), transform .38s cubic-bezier(.2,.9,.25,1.1);
  }
  body.in .card { opacity: 1; transform: none; }
  body.out .card {
    opacity: 0; transform: scale(.97);
    transition: opacity .18s cubic-bezier(.4,0,1,1), transform .18s cubic-bezier(.4,0,1,1);
  }
  header { display: flex; gap: 14px; align-items: center; }
  .badge {
    width: 44px; height: 44px; border-radius: 14px; flex: none; display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent);
  }
  .badge svg { width: 24px; height: 24px; transition: transform .5s cubic-bezier(.2,.9,.25,1.1); }
  [data-state="checking"] .badge svg, [data-state="installing"] .badge svg { animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .body { flex: 1; margin-top: 14px; color: var(--muted); min-height: 0; }
  #text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .swap { transition: opacity .2s cubic-bezier(.2,0,0,1); }
  .swap.fade { opacity: 0; }
  .progress { margin-top: 14px; height: 6px; border-radius: 99px; background: var(--track); overflow: hidden;
    opacity: 0; transition: opacity .2s; }
  .progress.on { opacity: 1; }
  .bar { height: 100%; width: 0; border-radius: inherit; background: var(--accent);
    transition: width .35s cubic-bezier(.2,0,0,1); }
  .pct { margin-top: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 17px; }
  footer { display: flex; justify-content: flex-end; gap: 8px; -webkit-app-region: no-drag; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 99px; padding: 9px 18px; cursor: pointer;
    transition: background-color .18s cubic-bezier(.2,0,0,1), transform .12s cubic-bezier(.2,0,0,1), opacity .2s;
  }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: #fff; }
  .primary:hover { background: var(--accent-hover); }
  .ghost { background: transparent; color: var(--fg); }
  .ghost:hover { background: var(--ghost-hover); }
  button[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    *, .card { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <header>
      <div class="badge" id="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="icon"></svg>
      </div>
      <div class="swap" id="head">
        <h1 id="title"></h1>
        <p class="sub" id="sub"></p>
      </div>
    </header>
    <div class="body">
      <div class="swap" id="text"></div>
      <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
      <div class="pct" id="pct"></div>
    </div>
    <footer>
      <button class="ghost" id="secondary"></button>
      <button class="primary" id="primary"></button>
    </footer>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  const ICONS = {
    download: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
    spinner: '<path d="M21 12a9 9 0 1 1-6.2-8.56"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    alert: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.01"/>',
  };
  let primaryAction = null;
  let lastKind = null;

  function view(s) {
    switch (s.kind) {
      case 'checking':
        return { icon: 'spinner', title: 'Buscando actualizaciones…', sub: 'Un momento', text: '', secondary: 'Cancelar' };
      case 'available':
        return {
          icon: 'download', title: 'Hay una actualización', sub: `Versión ${s.version} · tienes la ${s.current}`,
          text: s.portable
            ? 'Estás usando la versión portable. Descarga la nueva versión desde la página de descargas.'
            : 'Se descargará e instalará automáticamente. Pulso se reiniciará en unos segundos.',
          primary: s.portable ? 'Descargar' : 'Actualizar', action: 'update', secondary: 'Más tarde',
        };
      case 'progress':
        return { icon: 'download', title: 'Descargando actualización', sub: 'No cierres Pulso',
          text: '', progress: s.percent };
      case 'installing':
        return { icon: 'spinner', title: 'Instalando…', sub: `Versión ${s.version}`,
          text: 'Pulso se cerrará y volverá a abrirse con la nueva versión.', progress: 100 };
      case 'none':
        return { icon: 'check', title: 'Estás al día', sub: `Versión ${s.current}`,
          text: 'Ya tienes la última versión de Pulso.', primary: 'Aceptar', action: 'close' };
      case 'error':
        return { icon: 'alert', title: 'No se pudo actualizar', sub: 'Inténtalo de nuevo más tarde',
          text: s.message || '', primary: 'Reintentar', action: 'retry', secondary: 'Cerrar' };
      default:
        return null;
    }
  }

  function render(s) {
    const v = view(s);
    if (!v) return;
    const prev = lastKind;
    const changed = s.kind !== prev;
    lastKind = s.kind;
    const apply = () => {
      document.body.dataset.state = s.kind;
      $('icon').innerHTML = ICONS[v.icon];
      $('title').textContent = v.title;
      $('sub').textContent = v.sub;
      $('text').textContent = v.text;
      $('primary').hidden = !v.primary;
      $('primary').textContent = v.primary || '';
      $('secondary').hidden = !v.secondary;
      $('secondary').textContent = v.secondary || '';
      primaryAction = v.action;
      $('head').classList.remove('fade');
      $('text').classList.remove('fade');
    };
    const hasProgress = typeof v.progress === 'number';
    $('progress').classList.toggle('on', hasProgress);
    $('bar').style.width = hasProgress ? `${Math.max(2, v.progress)}%` : '0';
    $('pct').textContent = hasProgress && s.kind === 'progress' ? `${Math.round(v.progress)} %` : '';
    if (changed && prev !== null && document.body.classList.contains('in')) {
      $('head').classList.add('fade');
      $('text').classList.add('fade');
      setTimeout(apply, 160);
    } else {
      apply();
    }
  }

  function close() {
    document.body.classList.remove('in');
    document.body.classList.add('out');
    setTimeout(() => window.updater.closed(), 190);
  }

  $('primary').addEventListener('click', () => {
    if (primaryAction === 'close') close();
    else window.updater.action(primaryAction);
  });
  $('secondary').addEventListener('click', close);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !['progress', 'installing'].includes(lastKind)) close();
    if (e.key === 'Enter' && !$('primary').hidden && document.activeElement.tagName !== 'BUTTON') $('primary').click();
  });
  window.updater.onState(render);
  window.updater.onClose(close);
  window.updater.get().then((s) => {
    render(s);
    requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('in')));
  });
</script>
</body>
</html>
