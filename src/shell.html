<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Pulso</title>
<style>
  :root { --bg: #0e1413; --fg: #e8f3ee; --accent: #1fdf8a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body {
    font: 600 14px/1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    color: var(--fg); -webkit-font-smoothing: antialiased; user-select: none;
  }
  .bar {
    height: 40px; display: flex; align-items: center; padding: 0 14px; -webkit-app-region: drag;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand svg { width: 22px; height: 22px; }
  .brand span { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
  .pill {
    margin-left: 10px; padding: 4px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 700;
    background: var(--accent); color: #04140c; opacity: 0; transform: scale(.85);
    transition: opacity .22s cubic-bezier(.2,0,0,1), transform .3s cubic-bezier(.2,.9,.25,1.2);
  }
  .pill.on { opacity: 1; transform: none; }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#28e896"/><stop offset="1" stop-color="#12b878"/>
          </linearGradient>
        </defs>
        <path d="M20 46 L7 59 L12 42" fill="url(#g)"/>
        <circle cx="34" cy="30" r="23" fill="none" stroke="url(#g)" stroke-width="6"/>
        <path d="M17 32h8l4-10 6 20 4-11 3 4h8" fill="none" stroke="url(#g)" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Pulso</span>
    </div>
    <div class="pill" id="pill"></div>
  </div>
<script>
  const pill = document.getElementById('pill');
  function setUnread(n) {
    pill.classList.toggle('on', n > 0);
    if (n > 0) pill.textContent = `${n > 99 ? '99+' : n} sin leer`;
  }
  const setColor = (color) => document.documentElement.style.setProperty('--bg', color);
  window.shell.onUnread(setUnread);
  window.shell.onColor(setColor);
  window.shell.state().then(({ unread, color }) => { setUnread(unread); setColor(color); });
</script>
</body>
</html>
